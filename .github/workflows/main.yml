name: Playwright Python UI Automation & Allure

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && playwright install --with-deps

      - name: Run Pytest with Allure
        run: pytest --alluredir=allure-results
        continue-on-error: true

      - name: Generate Allure Report via Docker
        if: always()
        run: |
          docker run --rm \
            -v $(pwd)/allure-results:/app/allure-results \
            -v $(pwd)/allure-report:/app/allure-report \
            frankescobar/allure-docker-service allure generate /app/allure-results --clean -o /app/allure-report
        

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          name: github-pages
          path: allure-report
         

      - name: Deploy Allure Report to GitHub Pages
        uses: actions/deploy-pages@v4
        if: always()
        